<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corte vertical · Una jornada decente</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #123c33; }
      body { display: grid; place-items: center; }
      #phaser-root { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main id="phaser-root" aria-label="Corte vertical de Una jornada decente"></main>
    <div data-hud="energy" class="visually-hidden">Energía</div>
    <p id="slice-status" class="visually-hidden" aria-live="polite">Curso en marcha</p>
    <script type="module" src="/src/phaser-demo.ts"></script>
  </body>
</html>
